name: build-windows
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -q -r requirements.txt pyinstaller
      - name: Tests (protocol, simulated headsets, UI logic)
        timeout-minutes: 5
        shell: pwsh
        run: |
          if (Test-Path tests) {
            foreach ($t in "test_protocol","test_headset_mock","test_gui_stub","test_portable","test_winrt_fake","test_grace") {
              if (Test-Path "tests\$t.py") { python "tests\$t.py"; if ($LASTEXITCODE -ne 0) { throw "$t failed" } }
            }
          } else { Write-Host "No tests folder in the repo - skipping tests." }
      - name: Build exe
        run: python -m PyInstaller --noconsole --onefile --name SonyBridgeWindows --collect-submodules winrt --collect-binaries winrt --hidden-import pystray._win32 main.py
      - name: Self-test the built exe (winrt + tkinter bundled?)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\SonyBridgeWindows.exe -ArgumentList "--selftest" -PassThru
          $done = $p.WaitForExit(120000)
          if (Test-Path "$env:RUNNER_TEMP\selftest.log") { Write-Host "--- selftest.log ---"; Get-Content "$env:RUNNER_TEMP\selftest.log" }
          if (-not (Test-Path "$env:RUNNER_TEMP\selftest.log")) { Write-Host "selftest.log was never created: the exe did not get as far as running main.py" }
          if (-not $done) {
            Write-Host "--- processes of the exe (an error dialog would show as a window title) ---"
            Get-Process SonyBridgeWindows -ErrorAction SilentlyContinue | Format-List Id, MainWindowTitle, Responding
            Get-ChildItem "$env:USERPROFILE\SonyBridgeWindows-crash.log" -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_ }
            Get-Process SonyBridgeWindows -ErrorAction SilentlyContinue | Stop-Process -Force
            throw "selftest hung for 2 minutes"
          }
          if ($p.ExitCode -ne 0) { throw "selftest failed in the built exe (exit $($p.ExitCode))" }
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { choco install innosetup --no-progress -y; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$(python -c 'import sonybridge;print(sonybridge.__version__)')" installer\SonyBridgeWindows.iss
      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\portable | Out-Null
          Copy-Item dist\SonyBridgeWindows.exe dist\portable\
          Copy-Item installer\portable.txt dist\portable\portable.txt
          Compress-Archive -Path dist\portable\* -DestinationPath dist\SonyHeadphonesWidget-Portable.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            dist/SonyHeadphonesWidget-Setup.exe
            dist/SonyHeadphonesWidget-Portable.zip
